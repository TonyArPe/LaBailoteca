spring.application.name=bailoteca-backend

# Puerto donde se ejecuta la app
server.port=8080

# Configuración de conexión a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/bailoteca
spring.datasource.username=TonyArPe
spring.datasource.password=EstaContraseñaEsSuperSegura!

# JPA (Hibernate)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Charset
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always
spring.sql.init.platform=postgres

# Zona horaria y formato
spring.jackson.time-zone=Europe/Madrid
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss

# Lombok y otros
spring.main.allow-bean-definition-overriding=true

