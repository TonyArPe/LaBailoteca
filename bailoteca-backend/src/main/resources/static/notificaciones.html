<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Notificaciones en Tiempo Real</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #notificaciones {
            margin-top: 20px;
        }
        .notificacion {
            padding: 10px;
            border: 1px solid #ddd;
            margin-bottom: 5px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>📢 Notificaciones en Tiempo Real</h1>
    <div id="notificaciones"></div>

    <script>
        const socket = new SockJS('/ws');
        const stompClient = Stomp.over(socket);

        stompClient.connect({}, function (frame) {
            console.log('Conectado: ' + frame);
            stompClient.subscribe('/topic/notificaciones', function (mensaje) {
                mostrarNotificacion(JSON.parse(mensaje.body));
            });
        });

        function mostrarNotificacion(data) {
            const contenedor = document.getElementById("notificaciones");
            const div = document.createElement("div");
            div.classList.add("notificacion");
            div.textContent = `🔔 ${data.mensaje} (para ${data.receptor.nombre})`;
            contenedor.prepend(div); // Mostrar arriba
        }
    </script>
</body>
</html>
